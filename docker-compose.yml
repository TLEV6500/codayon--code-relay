networks:
  codayon:
    driver: bridge

services:
  server:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: docker/server/Dockerfile
      target: dev
    environment:
      PORT: ${SERVER_PORT:-3000}
    volumes:
      - ./packages/server/src:/app/packages/server/src
      - ./packages/shared/src:/app/packages/shared/src
    ports:
      - "${SERVER_PORT:-3000}:3000"
    networks:
      - codayon

  client:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: docker/client/Dockerfile
      target: dev
    environment:
      VITE_PROXY_TARGET: "http://server:3000"
    volumes:
      - ./packages/client/src:/app/packages/client/src
      - ./packages/shared/src:/app/packages/shared/src
    ports:
      - "${CLIENT_PORT:-5173}:5173"
    depends_on:
      - server
    networks:
      - codayon

  nginx:
    profiles: ["dev"]
    image: nginx:1.27-alpine
    environment:
      NGINX_PROFILE: "dev"
      UPSTREAM_HOST: "server"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/root.dev.conf:/etc/nginx/root.dev.conf:ro
      - ./docker/nginx/root.prod.conf:/etc/nginx/root.prod.conf:ro
      - ./docker/nginx/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      - server
      - client
    networks:
      - codayon

  server-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: docker/server/Dockerfile
      target: prod
    environment:
      PORT: ${SERVER_PORT:-3000}
    networks:
      - codayon

  nginx-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    environment:
      NGINX_PROFILE: "prod"
      UPSTREAM_HOST: "server-prod"
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      - server-prod
    networks:
      - codayon
