# Shared nginx config for both the dev and prod docker-compose profiles.
#
# Same-origin routing: unifies the client and the API/WebSocket relay under a
# single origin so the browser never needs cross-origin requests, mirroring
# the existing Vite dev-proxy shape (see packages/client/vite.config.ts).
#
# `/api` and `/ws` are identical in both profiles: always proxied to the
# `server` upstream. `/ws` MUST forward the WebSocket upgrade headers or the
# app's real-time relay (packages/server/src/ws.ts, built on
# @codemirror/collab — NOT y-websocket/Yjs) cannot complete its handshake.
#
# The only dev/prod difference is how `/` (everything else) is handled, and
# that's selected via the ROOT_LOCATION_INCLUDE env var (rendered by
# envsubst at container start — see docker/nginx/root.dev.conf.template and
# docker/nginx/root.prod.conf.template):
#   - dev:  proxies to the Vite dev server (CLIENT_ORIGIN), plain HTTP only
#           (no HMR WebSocket proxying — manual refresh expected after edits)
#   - prod: serves the pre-built static SPA from disk, falling back to
#           index.html for client-side routes

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # Resolve the `client`/`server` compose service names at runtime rather
  # than at nginx startup, so containers can start in any order.
  resolver 127.0.0.11 valid=10s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Real-time relay (Bun's native WebSocket handler, NOT Vite HMR).
    location /ws {
      proxy_pass http://server:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
    }

    # Room lifecycle HTTP API.
    location /api {
      proxy_pass http://server:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
      proxy_pass http://server:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    # Dev-vs-prod behavior for everything else. Rendered at container start
    # from root.dev.conf.template or root.prod.conf.template based on
    # NGINX_PROFILE (see docker-entrypoint wiring in docker-compose.yml).
    include /etc/nginx/conf.d/root.active.conf;
  }
}
